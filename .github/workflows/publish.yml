name: Publish to NPM

on:
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Verify & Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Check version against NPM registry
        id: check_version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VER=$(node -p "require('./package.json').version")
          NPM_VERS=$(npm view "$PKG_NAME" versions --json 2>/dev/null || echo "[]")
          ALREADY_PUBLISHED=$(node -e "try { const v = JSON.parse(process.argv[1]); console.log(Array.isArray(v) ? v.includes('$LOCAL_VER') : v === '$LOCAL_VER'); } catch { console.log(false); }" "$NPM_VERS")
          echo "Package: $PKG_NAME"
          echo "Local Version: $LOCAL_VER"
          echo "Already Published on NPM: $ALREADY_PUBLISHED"
          if [ "$ALREADY_PUBLISHED" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Version $LOCAL_VER is already published on npm. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          OUTPUT=$(npm publish --access public 2>&1) || {
            if echo "$OUTPUT" | grep -q "previously published"; then
              echo "Version is already published on npm."
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
